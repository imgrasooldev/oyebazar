# Baji worker — Fly.io
#
# Memory 2GB: Chromium ka har context ~80MB leta hai, aur 4 concurrent renders
# ke saath spikes aati hain. 1GB par OOM kills milte hain.
app = "oyebazar-worker"
primary_region = "sin" # Singapore — Pakistan ke sab se qareeb Fly region

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  RENDER_CONCURRENCY = "4"
  PORT = "8080"

# 🔴 `shared-cpu-4x`, `performance-1x` NAHI — aur ye sirf paison ki baat nahi.
#
# `performance-1x` ek DEDICATED core deta hai; `shared-cpu-4x` CHAAR burst wale.
# Hamara kaam 99% waqt bilkul khali baithta hai (naapa: load average 0.00) aur phir
# chand second ke liye bharakta hai — jab reseller "بنائیں" dabati hai, aur raat 3 baje.
# Aise kaam ke liye chaar burst core ek dedicated core se behtar hain: chaar render ek
# saath chal sakte hain, jabke ek core par wo qatar mein lagte the.
#
# Shared CPU wahan haarta hai jahan kaam DER TAK chalta rahe (throttle lagta hai) — yani
# raat ka bara batch jab hazaron pack banenge. Us din ek hukm se wapas performance par
# ja sakte hain:
#     flyctl scale vm performance-2x --memory 4096 -a oyebazar-worker
#
# Memory 2GB waise ki waisi: Chromium ka har context ~80MB leta hai aur 1GB par OOM
# kills milte the.
[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"

# Worker par HTTP traffic nahi aata — sirf health check.
# auto_stop band: queue mein job aane par machine ka boot hona (~10s) reseller ko
# intezar karwata hai, aur nightly pre-generation to chalte rehna chahiye.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"
