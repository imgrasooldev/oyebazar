<!doctype html>
<!--
  Status pack ka shared layout.

  🔴 Ye HTML browser mein khulta hai aur Playwright is ka screenshot leta hai.
     Canvas nahi — kyunke Urdu Nastaliq ko complex text shaping chahiye (haroof ki shakal
     context se badalti hai). Browser HarfBuzz use karta hai — wohi engine jo WhatsApp par hai.

  Naya template banana = `templates/<key>/template.css` mein CSS variables badalna. Koi deploy nahi.
  Placeholders (`{{...}}`) worker bharta hai — dekhen: apps/worker/src/render/template.ts
-->
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <style>
      {{baseCss}}
    </style>
    <!-- Naap kit se aata hai (packages/shared/pack-kit.ts) — CSS mein hard-code nahi -->
    <style>
      :root {
        --canvas-w: {{canvasWidth}}px;
        --canvas-h: {{canvasHeight}}px;
        --safe-top: {{safeTop}}px;
        --safe-bottom: {{safeBottom}}px;
        --scale: {{scale}};
      }
    </style>
    <style>
      {{templateCss}}
    </style>
  </head>
  <body>
    <div class="stage format-{{formatKey}} lang-{{lang}} {{hiddenClasses}}">
      <img class="photo" src="{{photoUrl}}" alt="" />
      <div class="scrim"></div>

      <div class="content">
        <div class="badge">{{badgeText}}</div>

        <div class="bottom">
          <div class="title">{{titleUr}}</div>

          <div class="price-row">
            <div class="price">{{priceText}}</div>
          </div>

          <div class="seller">
            <div class="seller-name">{{resellerName}}</div>
            <!--
              Number andar wale span mein — aur ye zaroori hai.

              🔴 `direction: ltr` us DABBE par nahi lag sakta jise jagah di jati hai:
              CSS ka `inset-inline-start` element ki APNI direction se naapta hai, is
              liye RTL pack mein wo dabba daayen ke bajaye baayen kinare se naapne
              lagta — aur reseller ke apne template mein number ghaseetne par ulti
              taraf jata tha. Qeemat pehle se isi tarah bani hui hai (.price-row > .price).
            -->
            <div class="seller-phone"><span class="ltr">{{resellerPhone}}</span></div>
          </div>

          <div class="cta">{{ctaText}}</div>
        </div>

        <!--
          Reseller ke apne likhe hue text. Built-in template par ye khali rehta hai —
          layers sirf us ke apne banaye hue template mein hote hain.
        -->
        {{layers}}
      </div>
    </div>
  </body>
</html>
