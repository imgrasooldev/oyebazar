# Baji web — Fly.io
app = "oyebazar-web"
primary_region = "sin"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Reseller subah 9 baje broadcast ke baad aati hai — cold start us waqt bura lagta hai,
  # magar ek machine hamesha chalti rehne se ye masla nahi hota
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
