# Baji web — Fly.io
app = "oyebazar-web"
primary_region = "sin"

[build]
  dockerfile = "apps/web/Dockerfile"

# 🔴 Migrations deploy se PEHLE — aur nakaam hone par deploy rok deti hain.
#
# Fly ye hukm ek alag, waqti machine par chalata hai (app ke apne secrets ke saath) aur
# tabhi naya version live karta hai jab ye kamyab ho.
#
# Wajah tajurbe se hai: is se pehle code migration se PEHLE live ho gaya tha aur
# production ne `Order.courier does not exist` dena shuru kar diya. Tarteeb yaad rakhne
# ka bharosa aadmi par rakhna hi ghalti thi — ab wo tarteeb yahan likhi hui hai.
#
# Ek aur faida: prod ka DATABASE_URL kisi ke laptop par utarne ki zaroorat nahi rehti.
[deploy]
  release_command = "node /usr/local/lib/prisma-cli.js migrate deploy --schema /app/packages/db/prisma/schema.prisma"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Reseller subah 9 baje broadcast ke baad aati hai — cold start us waqt bura lagta hai,
  # magar ek machine hamesha chalti rehne se ye masla nahi hota
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  # 🔴 Is se pehle web par koi check tha hi nahi — Fly har deploy par khud kehta tha
  # "No health checks found". Matlab app HANG ho jaye to Fly usay kabhi restart na karta:
  # site mari padi rehti aur pata tab chalta jab koi shikayat kare.
  #
  # Naap soch kar rakhi hai — check ka kaam site ko bachana hai, marwana nahi:
  #
  #  · interval 30s  — har 30 second mein ek dastak. Is se tez rakhne ka koi faida nahi;
  #                    hang aksar minton ka hota hai, second ka nahi.
  #  · timeout 5s    — route khud 3s par DB chhor deta hai, is liye us ka apna jawab
  #                    hamesha Fly ke sabr ke andar bana rehta hai (warna logs mein wajah
  #                    likhi hi na jati).
  #  · grace_period 20s — thanda start (Next + Prisma) is se kam mein poora nahi hota,
  #                    aur us se pehle poochhne ka anjaam ye hota ke har deploy khud ko
  #                    hi na-kamyab qarar de kar chakkar mein par jata.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
