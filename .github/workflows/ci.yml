name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 🔴 CI ko ASLI database ki zaroorat nahi.
    # `prisma generate` sirf schema parhta hai, magar datasource ka env var
    # mojood hona chahiye — is liye ye jhooti value. Koi test DB ko chhoota nahi:
    # core ke tests fake repositories par chalte hain aur price-leak test
    # source scan karta hai. Jis din integration tests aayenge, tab yahan
    # `services: postgres` add hoga.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma client generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm --filter @oyebazar/web build

      # 🔴 Ye job merge block karti hai. supplierPrice leak = build fail.
      - name: Security — price leak
        run: pnpm test:security
